---
layout: default
---
<article>
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="subtitle">{{ page.subtitle }}</p>{% endif %}
    <p class="byline">{{ page.author | default: site.author }}, <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
  </header>
  <div class="post-body{% unless page.dropcap == false %} dropcap{% endunless %}">
    {{ content }}
  </div>
</article>
